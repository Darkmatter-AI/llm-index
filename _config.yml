title: llm-index
description: Weekly-refreshed catalog of LLM provider models, pricing, and capabilities.
theme: jekyll-theme-primer
markdown: kramdown
exclude:
  - scripts/
  - skill/
  - .github/
  - README.md
# data/*.json is served verbatim — agents can fetch the structured
# source instead of scraping the rendered markdown.
defaults:
  - scope:
      path: ""
    values:
      layout: default
