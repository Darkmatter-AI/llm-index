name: Update provider data

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      providers:
        description: "Space-separated provider slugs (blank = all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update-providers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Run updater
        id: update
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: uv run scripts/update.py ${{ github.event.inputs.providers }}

      - name: Commit changes
        if: ${{ !cancelled() }}
        env:
          COST_ESTIMATE: ${{ steps.update.outputs.cost_estimate }}
        run: |
          git config user.name "llm-index-bot"
          git config user.email "llm-index-bot@users.noreply.github.com"
          if git diff --quiet -- providers/; then
            echo "No changes to commit."
            exit 0
          fi
          git add providers/
          SUBJECT="chore: refresh provider data ($(date -u +%Y-%m-%d))"
          if [ -n "$COST_ESTIMATE" ]; then
            git commit -m "$SUBJECT" -m "$COST_ESTIMATE"
          else
            git commit -m "$SUBJECT"
          fi
          git push
