name: Update provider data

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      providers:
        description: "Space-separated provider slugs (blank = all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update-providers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Run updater
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.providers }}" ]; then
            python scripts/update.py ${{ github.event.inputs.providers }}
          else
            python scripts/update.py
          fi

      - name: Commit changes
        run: |
          git config user.name "llm-index-bot"
          git config user.email "llm-index-bot@users.noreply.github.com"
          if git diff --quiet -- providers/; then
            echo "No changes to commit."
            exit 0
          fi
          git add providers/
          git commit -m "chore: refresh provider data ($(date -u +%Y-%m-%d))"
          git push
